name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Headless smoke run
        run: ./gradlew run --args="--headless --duration 600"

      - name: Compare controllers
        run: ./gradlew batch --args="--seeds 1 --duration 1200"
